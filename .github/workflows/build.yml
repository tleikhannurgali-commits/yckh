name: Build StorageESP Forge v1.2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21 and Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Arrange files into a Forge source project
        shell: bash
        run: |
          mkdir -p src/main/java/com/example/storageesp
          mkdir -p src/main/resources/META-INF
          mkdir -p src/main/resources/assets/storageesp/lang
          cp ./*.java src/main/java/com/example/storageesp/
          cp mods.toml src/main/resources/META-INF/mods.toml
          sed -i 's/version="1\.1\.0"/version="1.2.1"/' src/main/resources/META-INF/mods.toml
          cp pack.mcmeta src/main/resources/
          cp en_us.json ru_ru.json src/main/resources/assets/storageesp/lang/

      - name: Compile Forge mod
        run: gradle clean build --no-daemon --console=plain --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: StorageESP-Forge-v1.2.1
          path: build/libs/*.jar
          if-no-files-found: error

name: Build StorageESP Forge v1.2.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build mod
        working-directory: StorageESP
        run: gradle clean build --no-daemon --console=plain --stacktrace

      - name: Upload mod JAR v1.2.1
        uses: actions/upload-artifact@v4
        with:
          name: StorageESP-Forge-1.21.11-v1.2.1
          path: StorageESP/build/libs/*.jar
          if-no-files-found: error
